name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'raddflix_flutter/**'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: false
        default: 'debug'
        type: choice
        options: [debug, release]

jobs:
  build:
    name: Build ${{ github.event.inputs.build_type || 'debug' }} APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: raddflix_flutter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyse code
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      # ── Debug APK (no signing required) ──────────────────────────────────────
      - name: Build debug APK
        if: ${{ github.event.inputs.build_type != 'release' }}
        run: flutter build apk --debug --split-debug-info=build/symbols

      - name: Upload debug APK
        if: ${{ github.event.inputs.build_type != 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: raddflix-debug-${{ github.run_number }}
          path: raddflix_flutter/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

      # ── Release APK (requires keystore secrets) ───────────────────────────────
      - name: Decode keystore
        if: ${{ github.event.inputs.build_type == 'release' && secrets.KEYSTORE_BASE64 != '' }}
        run: |
          mkdir -p android/app/keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore/raddflix.keystore

      - name: Build release APK
        if: ${{ github.event.inputs.build_type == 'release' && secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_PATH:     android/app/keystore/raddflix.keystore
          KEYSTORE_TYPE:     PKCS12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS:         ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:      ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release --split-debug-info=build/symbols

      - name: Build release APK (unsigned fallback — no secrets configured)
        if: ${{ github.event.inputs.build_type == 'release' && secrets.KEYSTORE_BASE64 == '' }}
        run: |
          echo "KEYSTORE_BASE64 secret not set — building unsigned release APK"
          flutter build apk --release --split-debug-info=build/symbols \
            || flutter build apk --debug --split-debug-info=build/symbols

      - name: Upload release APK
        if: ${{ github.event.inputs.build_type == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: raddflix-release-${{ github.run_number }}
          path: raddflix_flutter/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      # ── Build summary ─────────────────────────────────────────────────────────
      - name: Write job summary
        if: always()
        run: |
          echo "## RaddFlix APK Build" >> $GITHUB_STEP_SUMMARY
          echo "- **Type:** ${{ github.event.inputs.build_type || 'debug' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Run:** #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          if [ -f build/app/outputs/flutter-apk/app-debug.apk ]; then
            SIZE=$(du -sh build/app/outputs/flutter-apk/app-debug.apk | cut -f1)
            echo "- **Debug APK size:** $SIZE" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            SIZE=$(du -sh build/app/outputs/flutter-apk/app-release.apk | cut -f1)
            echo "- **Release APK size:** $SIZE" >> $GITHUB_STEP_SUMMARY
          fi
