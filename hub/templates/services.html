{% extends "base.html" %}
{% set active="services" %}
{% block title %}Services — Radd Hub{% endblock %}
{% block content %}
<style>
.svc-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 20px 22px;
  display: flex;
  align-items: flex-start;
  gap: 18px;
  transition: border-color .2s, background .2s;
  position: relative;
}
.svc-card.state-warn  { border-color: #f59e0b55; background: #1a1600; }
.svc-card.state-error { border-color: #ef444444; background: #180a0a; }
.svc-card.state-on    { border-color: #22c55e33; }

.svc-icon {
  font-size: 26px;
  line-height: 1;
  padding-top: 2px;
  flex-shrink: 0;
  width: 36px;
  text-align: center;
}
.svc-body  { flex: 1; min-width: 0; }
.svc-title { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
.svc-desc  { font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.5; }
.svc-meta  { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 9px; align-items: center; }

.svc-pill {
  font-size: 10px; font-weight: 600; padding: 2px 8px;
  border-radius: 10px; white-space: nowrap;
  background: var(--panel2); color: var(--muted);
  border: 1px solid var(--border);
}
.svc-pill.needs { color: #7c5cff; border-color: #7c5cff44; background: #1a1430; }
.svc-pill.warn  { color: #f59e0b; border-color: #f59e0b44; background: #1a1400; }
.svc-pill.error { color: #ef4444; border-color: #ef444433; background: #180a0a; }

/* Big toggle */
.big-toggle { position: relative; display: inline-block; width: 56px; height: 30px; flex-shrink: 0; }
.big-toggle input { opacity: 0; width: 0; height: 0; position: absolute; }
.big-slider {
  position: absolute; cursor: pointer; inset: 0;
  background: var(--panel2); border: 1px solid var(--border);
  border-radius: 30px; transition: .2s;
}
.big-slider:before {
  content: ''; position: absolute;
  height: 22px; width: 22px; left: 3px; bottom: 3px;
  background: var(--muted); border-radius: 50%; transition: .2s;
}
.big-toggle input:checked + .big-slider { background: var(--ok, #22c55e); border-color: var(--ok, #22c55e); }
.big-toggle input:checked + .big-slider:before { transform: translateX(26px); background: #fff; }
.big-toggle input:disabled + .big-slider { opacity: .5; cursor: not-allowed; }

.svc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media(max-width: 900px) { .svc-grid { grid-template-columns: 1fr; } }

.dep-chain {
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  margin-top: 10px; font-size: 11px; color: var(--muted);
}
.dep-arrow { color: var(--border); }
.dep-node {
  padding: 2px 8px; border-radius: 6px;
  background: var(--panel2); border: 1px solid var(--border);
  font-size: 11px; font-weight: 600;
}
.dep-node.is-on  { color: var(--ok); border-color: #22c55e44; background: #0d1f12; }
.dep-node.is-off { color: var(--muted); }

.refresh-bar {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 20px;
}
.refresh-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--ok); animation: svc-pulse 2s infinite;
}
@keyframes svc-pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

.svc-supervisor-badge {
  font-size: 10px; padding: 2px 7px; border-radius: 8px;
  background: #1d2a3d; color: var(--blue); font-weight: 600;
}
</style>

<div class="h-row">
  <div>
    <h2>Background Services</h2>
    <div class="muted" style="font-size:13px;margin-top:3px">Toggle every background service from one place. Dependency order is enforced automatically.</div>
  </div>
  <button class="ghost" onclick="loadSvcs()" style="padding:6px 14px;font-size:13px">&#8635; Refresh</button>
</div>

<div class="refresh-bar">
  <div class="refresh-dot" id="live-dot"></div>
  <span class="muted" style="font-size:12px" id="last-refresh-lbl">Loading…</span>
</div>

<div class="svc-grid" id="svc-grid">
  <div class="svc-card" style="grid-column:1/-1">
    <div class="muted" style="padding:10px 0">Loading services…</div>
  </div>
</div>

<script>
const SVC_ICONS = {
  keepalive:    '❤️',
  scan:         '🔍',
  upload:       '☁️',
  scheduler:    '📅',
  download:     '⬇️',
  mirror:       '🪞',
  domain_doctor:'🌐',
  wa_bot:       '💬',
};

let _svcStates = {};

function svcLabel(name) {
  const map = {
    keepalive:'JazzDrive Keepalive', scan:'Scanner', upload:'Upload Watcher',
    scheduler:'Smart Scheduler', download:'Download Queue', mirror:'Mirror Retry',
    domain_doctor:'Domain Doctor', wa_bot:'WhatsApp Bot'
  };
  return map[name] || name;
}

async function loadSvcs() {
  const dot = document.getElementById('live-dot');
  const lbl = document.getElementById('last-refresh-lbl');
  if (dot) dot.style.background = 'var(--warn)';
  try {
    const r = await fetch('/admin/api/services', { credentials: 'include' });
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || 'load failed');

    // Cache states for dependency lookups
    _svcStates = {};
    d.services.forEach(s => { _svcStates[s.name] = s.enabled; });

    renderSvcs(d.services);
    if (lbl) lbl.textContent = 'Live · updated ' + new Date().toLocaleTimeString();
    if (dot) dot.style.background = 'var(--ok)';
  } catch(e) {
    if (lbl) lbl.textContent = 'Failed to load: ' + e.message;
    if (dot) dot.style.background = 'var(--err)';
  }
}

function renderSvcs(services) {
  const grid = document.getElementById('svc-grid');
  if (!grid) return;

  grid.innerHTML = services.map(svc => {
    const isOn = svc.enabled;
    const icon = SVC_ICONS[svc.name] || '⚙️';
    const isSupervisor = !!svc.supervisor;

    // State class
    let stateClass = isOn ? 'state-on' : '';
    if (isOn && svc.missing_deps && svc.missing_deps.length) stateClass = 'state-warn';
    if (!isOn && svc.broken_rdeps && svc.broken_rdeps.length) stateClass = 'state-error';

    // Deps row
    let depsHtml = '';
    if (svc.deps && svc.deps.length) {
      depsHtml = '<div class="dep-chain"><span>needs:</span>'
        + svc.deps.map(d => {
            const on = _svcStates[d] !== undefined ? _svcStates[d] : false;
            return '<span class="dep-node ' + (on ? 'is-on' : 'is-off') + '">' + svcLabel(d) + '</span>';
          }).join('<span class="dep-arrow">→</span>')
        + '</div>';
    }

    // Warnings
    let warningsHtml = '';
    if (isOn && svc.missing_deps && svc.missing_deps.length) {
      warningsHtml += '<div class="svc-meta">'
        + svc.missing_deps.map(d => '<span class="svc-pill warn">⚠ needs ' + svcLabel(d) + ' ON</span>').join('')
        + '</div>';
    }
    if (!isOn && svc.broken_rdeps && svc.broken_rdeps.length) {
      warningsHtml += '<div class="svc-meta">'
        + svc.broken_rdeps.map(d => '<span class="svc-pill error">✗ ' + svcLabel(d) + ' needs this</span>').join('')
        + '</div>';
    }

    // Supervisor badge
    const supBadge = isSupervisor
      ? '<span class="svc-supervisor-badge">supervisorctl</span>' : '';

    // ON/OFF badge
    const stateBadge = isOn
      ? '<span class="badge b-ok" style="font-size:11px">ON</span>'
      : '<span class="badge b-err" style="font-size:11px">OFF</span>';

    return `
      <div class="svc-card ${stateClass}" id="svc-card-${svc.name}">
        <div class="svc-icon">${icon}</div>
        <div class="svc-body">
          <div class="svc-title">
            ${svc.label}
            ${stateBadge}
            ${supBadge}
          </div>
          <div class="svc-desc">${svc.desc}</div>
          ${depsHtml}
          ${warningsHtml}
        </div>
        <label class="big-toggle" title="${isOn ? 'Click to disable' : 'Click to enable'}" style="margin-top:4px">
          <input type="checkbox" ${isOn ? 'checked' : ''}
                 onchange="toggleSvc('${svc.name}', this.checked, this)">
          <span class="big-slider"></span>
        </label>
      </div>`;
  }).join('');
}

async function toggleSvc(name, enabled, cb) {
  cb.disabled = true;
  const card = document.getElementById('svc-card-' + name);
  if (card) card.style.opacity = '0.6';
  try {
    const r = await fetch('/admin/api/services/toggle', {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ service: name, enabled })
    });
    const d = await r.json();
    if (!d.ok) {
      cb.checked = !enabled;
      toast('Error: ' + (d.error || d.output || 'unknown'), 4000);
    } else {
      if (d.auto_enabled && d.auto_enabled.length) {
        toast('Auto-enabled first: ' + d.auto_enabled.map(svcLabel).join(', '), 3500);
      }
      if (d.warnings && d.warnings.length) {
        d.warnings.forEach(w => toast('⚠ ' + w, 5000));
      }
      if (!d.auto_enabled || !d.auto_enabled.length) {
        toast((enabled ? '✅ ' : '⏹ ') + svcLabel(name) + ' ' + (enabled ? 'enabled' : 'disabled'));
      }
      setTimeout(loadSvcs, 600);
    }
  } catch(e) {
    cb.checked = !enabled;
    toast('Request failed: ' + e.message, 4000);
  } finally {
    cb.disabled = false;
    if (card) card.style.opacity = '';
  }
}

// Load on page open + auto-refresh every 15s
loadSvcs();
setInterval(loadSvcs, 15000);
</script>
{% endblock %}
