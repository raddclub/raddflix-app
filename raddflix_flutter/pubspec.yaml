name: raddflix
description: RaddFlix - Pakistan ka entertainment, data-free
publish_to: 'none'
version: 1.0.0+3

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.4.9

  # HTTP client
  dio: ^5.4.0

  # Secure token storage
  flutter_secure_storage: ^9.0.0

  # Biometric + PIN auth for vault
  local_auth: ^2.2.0

  # SHA-256 PIN hashing for vault
  crypto: ^3.0.3

  # Video thumbnail generation for local/downloaded files
  video_thumbnail: ^0.5.3

  # Local SQLite — SQLCipher edition (AES-256 full-file encryption).
  # Pinned to 3.1.0+1 — last release before 3.2.0 which introduced flutter.compileSdkVersion
  # flutter.compileSdkVersion in build.gradle, which breaks Gradle on
  # Flutter 3.22.x CI (AGP version mismatch).
  sqflite_sqlcipher: 3.1.0+1  # pinned: NEVER upgrade until CI uses Flutter 3.27+ (see AGENT_HANDOFF)
  path_provider: ^2.1.2
  path: ^1.9.0

  # Video player
  media_kit: ^1.1.10
  media_kit_video: ^1.2.4
  media_kit_libs_android_video: ^1.3.2

  # Image caching
  cached_network_image: ^3.3.1

  # Device info
  device_info_plus: ^9.1.2

  # Network
  connectivity_plus: ^6.0.2

  # Player controls
  screen_brightness: ^0.2.2+1
  volume_controller: ^2.0.7
  wakelock_plus: ^1.1.4

  # Storage
  shared_preferences: ^2.2.2

  # File picker for subtitles
  file_picker: ^8.0.0

  # Fonts
  google_fonts: ^6.1.0

  # --- NEW PACKAGES ---

  # Smooth declarative animations
  flutter_animate: ^4.5.0

  # Modern icon family — Phosphor (2600+ icons, outline+fill pairs, no asset fonts)
  phosphor_flutter: ^2.0.0

  # Skeleton/shimmer loading
  shimmer: ^3.0.0

  # Onboarding page indicator
  smooth_page_indicator: ^1.1.0

  # Date formatting
  intl: ^0.19.0

  # App version info (for update check)
  package_info_plus: ^8.0.2
  share_plus: ^10.1.4

  # Open URLs (for update dialog)
  url_launcher: ^6.3.0

  # Share files and text (used in debug_logger.dart)

  # Launch external apps with intents ("Open with" external video player)
  android_intent_plus: ^4.0.0

  # Disk space info for downloads screen
  disk_space_plus: ^0.2.0

  # Animation system — Phase 41 (tier-gated, 3 packages)
  # animations: Google's OpenContainer morph transition (Tier 2+)
  # flutter_staggered_animations: list/grid cascade-in stagger (Tier 1+)
  # animated_text_kit: typewriter, wavy, fade text effects (Tier 1+)
  animations: ^2.0.11
  flutter_staggered_animations: ^1.1.1
  animated_text_kit: ^4.2.2

  # Player extended packages
  saver_gallery: ^3.0.6
  flutter_colorpicker: ^1.1.0
  audio_session: ^0.1.21

  # Phase 59: Android on-device TTS for AI dubbing
  flutter_tts: ">=4.2.5 <5.0.0" # Fix #22: pin to known-good range (Kotlin-2.2.0 + minSdk-24 confirmed)

  # IDEA-01: Universal Subtitle Hunter — ZIP archive extraction
  archive: ^3.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
